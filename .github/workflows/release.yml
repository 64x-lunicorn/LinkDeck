# Publishes a release when a version bump reaches main. See docs/releasing.md.
#
# A release is a squash-merged "chore(release): vX.Y.Z" pull request that
# raised the version in package.json, package-lock.json and
# public/manifest.json and added the CHANGELOG.md section. Its merge commit
# already passed the CI gate; this workflow re-runs the checks on that exact
# commit, builds the ZIP, attests its provenance, creates the vX.Y.Z tag with
# the GitHub release and, once a Chrome Web Store item is configured, uploads
# and publishes it behind the chrome-web-store environment.
#
# Every step is idempotent: when the tag already exists nothing happens, so a
# failed run can simply be re-run, or started again by hand.
name: Release

on:
  push:
    branches: [main]
    paths: [public/manifest.json]
  workflow_dispatch:

permissions: {}

# Never cancel a release half way; queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Read the shared version
        id: version
        run: |
          set -euo pipefail
          version="$(node scripts/release.mjs version)"
          node scripts/release.mjs notes "${version}" > /dev/null
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether the tag exists
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already released; nothing to do."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: a release must not restore anything a pull
      # request could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security audit
        run: npm audit --omit=dev

      - name: Build
        run: npm run build

      - name: Package extension
        run: |
          set -euo pipefail
          test "$(node -p 'require("./dist/manifest.json").version')" = "${VERSION}"
          mkdir -p release
          (cd dist && zip -X -r "../release/linkdeck-v${VERSION}.zip" .)
          (cd release && sha256sum "linkdeck-v${VERSION}.zip" > "linkdeck-v${VERSION}.zip.sha256")
          cat "release/linkdeck-v${VERSION}.zip.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/linkdeck-v${{ needs.plan.outputs.version }}.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release/

      # gh uploads the assets to a draft first and publishes afterwards, so the
      # release is never visible without its ZIP.
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.mjs notes "${VERSION}" > release-notes.md
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "LinkDeck v${VERSION}" \
            --notes-file release-notes.md \
            "release/linkdeck-v${VERSION}.zip" \
            "release/linkdeck-v${VERSION}.zip.sha256"

  chrome-web-store:
    name: Chrome Web Store
    needs: [plan, github-release]
    # Stays off until the store item exists and the repository variables are set.
    if: vars.CWS_EXTENSION_ID != '' && vars.CWS_PUBLISHER_ID != ''
    runs-on: ubuntu-24.04
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions: {}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release/

      # Chrome Web Store API v2:
      # https://developer.chrome.com/docs/webstore/using-api
      - name: Upload and publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          api="https://chromewebstore.googleapis.com"
          item="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"

          token="$(curl -sS --fail-with-body -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CWS_CLIENT_ID}" \
            --data-urlencode "client_secret=${CWS_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${CWS_REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token" | jq -r '.access_token')"
          echo "::add-mask::${token}"

          upload="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${token}" \
            -T "release/linkdeck-v${VERSION}.zip" \
            "${api}/upload/v2/${item}:upload")"
          echo "upload: ${upload}"
          state="$(jq -r '.uploadState' <<< "${upload}")"

          for _ in $(seq 30); do
            case "${state}" in
              SUCCEEDED) break ;;
              *IN_PROGRESS)
                sleep 10
                state="$(curl -sS --fail-with-body \
                  -H "Authorization: Bearer ${token}" \
                  "${api}/v2/${item}:fetchStatus" | jq -r '.lastAsyncUploadState')" ;;
              *)
                echo "::error::Chrome Web Store upload ended in state ${state}."
                exit 1 ;;
            esac
          done
          if [ "${state}" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not finish (last state ${state})."
            exit 1
          fi

          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH"}' \
            "${api}/v2/${item}:publish"
