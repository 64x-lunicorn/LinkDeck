rules:
  cache-poisoning:
    ignore:
      # actions/setup-node's cache is explicitly disabled here
      # (cache: false) for this tag-triggered release workflow.
      # zizmor's offline heuristic still flags any setup-node use in a
      # release workflow regardless of that setting (verified locally:
      # neither omitting `cache` nor `cache: false` clears the finding).
      # https://docs.zizmor.sh/audits/#cache-poisoning
      - release.yml:19
